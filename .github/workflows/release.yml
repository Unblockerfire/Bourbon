name: Bourbon Release

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Build and upload validation artifacts without publishing a release'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and Appcast
    runs-on: macos-15

    env:
      PROJECT_PATH: Source/Whisky.xcodeproj
      SCHEME: Bourbon
      CONFIGURATION: Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print checkout revision
        shell: bash
        run: |
          set -euo pipefail

          echo "GitHub ref: ${GITHUB_REF}"
          echo "GitHub ref name: ${GITHUB_REF_NAME}"
          echo "GitHub ref type: ${GITHUB_REF_TYPE}"
          echo "GitHub SHA: ${GITHUB_SHA}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          git status --short

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [ -d /Applications/Xcode-beta.app ]; then
            sudo xcode-select -s /Applications/Xcode-beta.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi

          xcodebuild -version

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
          else
            TAG="manual-${GITHUB_RUN_NUMBER}"
            VERSION="$(awk -F ' = |;' '/MARKETING_VERSION = / { print $2; exit }' "$PROJECT_PATH/project.pbxproj")"
          fi

          CORE_VERSION="$(printf '%s' "$VERSION" | sed -E 's/[-+_ ].*$//')"
          MAJOR="$(printf '%s' "$CORE_VERSION" | awk -F. '{ print $1 + 0 }')"
          MINOR="$(printf '%s' "$CORE_VERSION" | awk -F. '{ print $2 + 0 }')"
          PATCH="$(printf '%s' "$CORE_VERSION" | awk -F. '{ print $3 + 0 }')"
          NORMAL_MINOR="$MINOR"
          EMERGENCY_LEVEL="0"
          LOWER_VERSION="$(printf '%s' "$VERSION" | tr '[:upper:]' '[:lower:]')"
          CHANNEL=""

          if [ "$MINOR" -ge 10 ] && [ "$MINOR" -le 99 ]; then
            NORMAL_MINOR="$((MINOR / 10))"
            EMERGENCY_LEVEL="$((MINOR % 10))"
          fi

          if [[ "$LOWER_VERSION" == *beta* ]] ||
             [[ "$LOWER_VERSION" == *-pre* ]] ||
             [[ "$LOWER_VERSION" == *prerelease* ]] ||
             [[ "$LOWER_VERSION" == *pre-release* ]] ||
             [[ "$LOWER_VERSION" == *rc* ]]; then
            CHANNEL="pre"
          fi

          if [ "$EMERGENCY_LEVEL" -gt 0 ]; then
            RELEASE_KIND="emergency"
          elif [ "$PATCH" -gt 0 ]; then
            RELEASE_KIND="patch"
          elif [ "$NORMAL_MINOR" -gt 0 ]; then
            RELEASE_KIND="minor"
          else
            RELEASE_KIND="major"
          fi

          # Bourbon versions use MAJOR.MINOR.PATCH. Emergency updates are
          # encoded inside a two-digit minor number: in X.13.X, 1 is the normal
          # minor version and 3 is the emergency marker/level. Sparkle treats an
          # update as manual-confirm when the installed version is lower than
          # sparkle:minimumAutoupdateVersion. Setting this to the new major
          # baseline keeps cross-major upgrades out of automatic installs while
          # minor, emergency-marker, and patch updates remain eligible.
          MINIMUM_AUTOUPDATE_VERSION="${MAJOR}.0.0"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=Bourbon${VERSION}.dmg" >> "$GITHUB_OUTPUT"
          echo "release_kind=${RELEASE_KIND}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "minimum_autoupdate_version=${MINIMUM_AUTOUPDATE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure release paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/BourbonDerivedData"
          PACKAGE_CACHE="$RUNNER_TEMP/BourbonSourcePackages"
          BUILD_ROOT="$RUNNER_TEMP/BourbonRelease"
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"

          echo "DERIVED_DATA=$DERIVED_DATA" >> "$GITHUB_ENV"
          echo "PACKAGE_CACHE=$PACKAGE_CACHE" >> "$GITHUB_ENV"
          echo "BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"
          echo "dmg=$BUILD_ROOT/$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$BUILD_ROOT/$DMG_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "appcast=$BUILD_ROOT/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Enforce BourbonWine macOS compatibility
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME_JSON="$RUNNER_TEMP/bourbon-runtime.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/bourbon-runtime.tar.gz"
          RUNTIME_ROOT="$RUNNER_TEMP/bourbon-runtime"
          SUPPORTED_MACOS="$(bash Scripts/bourbon-minimum-macos.sh)"
          mkdir -p "$RUNTIME_ROOT"

          curl --fail --silent --show-error \
            https://api.getbourbon.app/runtime/latest \
            --output "$RUNTIME_JSON"
          RUNTIME_URL="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["archiveUrl"])' \
            "$RUNTIME_JSON")"
          RUNTIME_SHA="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' \
            "$RUNTIME_JSON")"
          curl --fail --location --silent --show-error \
            "$RUNTIME_URL" \
            --output "$RUNTIME_ARCHIVE"
          printf '%s  %s\n' "$RUNTIME_SHA" "$RUNTIME_ARCHIVE" | shasum -a 256 --check
          tar -xzf "$RUNTIME_ARCHIVE" -C "$RUNTIME_ROOT"

          python3 Scripts/validate-wine-runtime.py "$RUNTIME_ROOT/Libraries/Wine" \
            --maximum-minimum "$SUPPORTED_MACOS" \
            --report "$RUNNER_TEMP/bourbon-runtime-mach-o.tsv" \
            --links-report "$RUNNER_TEMP/bourbon-runtime-links.txt"

      - name: Build Bourbon
        shell: bash
        run: |
          set -euo pipefail

          UPDATE_FEED_CHANNEL="stable"
          if [ -n "${{ steps.version.outputs.channel }}" ]; then
            UPDATE_FEED_CHANNEL="pre"
          fi

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            INFOPLIST_KEY_SUFeedURL="https://api.getbourbon.app/updates/$UPDATE_FEED_CHANNEL/appcast.xml" \
            build

      - name: Write build metadata
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIGURATION/Bourbon.app"
          BUILD_INFO_PATH="$APP_PATH/Contents/Resources/BuildInfo.json"

          if [ ! -d "$APP_PATH" ]; then
            echo "Bourbon.app was not found at $APP_PATH"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -name 'Bourbon.app' -print || true
            exit 1
          fi

          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Contents/Info.plist")"
          GIT_COMMIT="$(git rev-parse HEAD)"
          GIT_BRANCH=""
          GIT_TAG=""

          if [ "${GITHUB_REF_TYPE:-}" = "branch" ]; then
            GIT_BRANCH="$GITHUB_REF_NAME"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            GIT_TAG="$GITHUB_REF_NAME"
          fi

          export MARKETING_VERSION BUILD_NUMBER GIT_COMMIT GIT_BRANCH GIT_TAG

          mkdir -p "$(dirname "$BUILD_INFO_PATH")"
          python3 - "$BUILD_INFO_PATH" <<PY
          import json
          import os
          import sys
          from datetime import datetime, timezone

          path = sys.argv[1]
          payload = {
              "gitCommit": os.environ["GIT_COMMIT"],
              "gitBranch": os.environ["GIT_BRANCH"],
              "gitRef": os.environ["GITHUB_REF"],
              "gitTag": os.environ["GIT_TAG"],
              "marketingVersion": os.environ["MARKETING_VERSION"],
              "buildNumber": os.environ["BUILD_NUMBER"],
              "buildDateUTC": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open(path, "w", encoding="utf-8") as build_info:
              json.dump(payload, build_info, indent=2, sort_keys=True)
              build_info.write("\\n")
          PY

          cat "$BUILD_INFO_PATH"

      - name: Prepare application bundle
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$DERIVED_DATA/Build/Products/$CONFIGURATION/Bourbon.app"
          RELEASE_APP="$BUILD_ROOT/dmg-root/Bourbon.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Bourbon.app was not found at $APP_PATH"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -name 'Bourbon.app' -print || true
            exit 1
          fi

          mkdir -p "$BUILD_ROOT/dmg-root/.background"
          ditto "$APP_PATH" "$RELEASE_APP"
          ln -s /Applications "$BUILD_ROOT/dmg-root/Applications"

          swift - "$BUILD_ROOT/dmg-root/.background/BourbonDMGBackground.png" <<'SWIFT'
          import AppKit
          import Foundation

          let outputPath = CommandLine.arguments[1]
          let size = NSSize(width: 640, height: 360)
          let image = NSImage(size: size)

          image.lockFocus()

          NSColor(calibratedRed: 0.07, green: 0.04, blue: 0.03, alpha: 1).setFill()
          NSRect(origin: .zero, size: size).fill()

          let gradient = NSGradient(colors: [
              NSColor(calibratedRed: 0.20, green: 0.12, blue: 0.07, alpha: 1),
              NSColor(calibratedRed: 0.05, green: 0.025, blue: 0.02, alpha: 1)
          ])
          gradient?.draw(in: NSRect(origin: .zero, size: size), angle: 90)

          let title = "Welcome to Bourbon"
          let subtitle = "Whisky, but a bit stronger."
          let instruction = "Drag Bourbon to Applications"
          let followUpInstruction = "Then double-click Applications and search Bourbon"

          let paragraph = NSMutableParagraphStyle()
          paragraph.alignment = .center

          title.draw(
              in: NSRect(x: 40, y: 258, width: 560, height: 44),
              withAttributes: [
                  .font: NSFont.systemFont(ofSize: 34, weight: .bold),
                  .foregroundColor: NSColor(calibratedRed: 1, green: 0.95, blue: 0.86, alpha: 1),
                  .paragraphStyle: paragraph
              ]
          )

          subtitle.draw(
              in: NSRect(x: 40, y: 228, width: 560, height: 28),
              withAttributes: [
                  .font: NSFont.systemFont(ofSize: 18, weight: .semibold),
                  .foregroundColor: NSColor(calibratedRed: 0.96, green: 0.70, blue: 0.27, alpha: 1),
                  .paragraphStyle: paragraph
              ]
          )

          instruction.draw(
              in: NSRect(x: 40, y: 56, width: 560, height: 30),
              withAttributes: [
                  .font: NSFont.systemFont(ofSize: 24, weight: .bold),
                  .foregroundColor: NSColor(calibratedRed: 1, green: 0.88, blue: 0.65, alpha: 1),
                  .paragraphStyle: paragraph
              ]
          )

          followUpInstruction.draw(
              in: NSRect(x: 40, y: 30, width: 560, height: 24),
              withAttributes: [
                  .font: NSFont.systemFont(ofSize: 17, weight: .semibold),
                  .foregroundColor: NSColor(calibratedRed: 0.96, green: 0.70, blue: 0.27, alpha: 1),
                  .paragraphStyle: paragraph
              ]
          )

          let arrowPath = NSBezierPath()
          arrowPath.move(to: NSPoint(x: 272, y: 161))
          arrowPath.line(to: NSPoint(x: 368, y: 161))
          arrowPath.move(to: NSPoint(x: 344, y: 185))
          arrowPath.line(to: NSPoint(x: 368, y: 161))
          arrowPath.line(to: NSPoint(x: 344, y: 137))
          arrowPath.lineWidth = 7
          arrowPath.lineCapStyle = .round
          arrowPath.lineJoinStyle = .round
          NSColor(calibratedRed: 0.98, green: 0.64, blue: 0.20, alpha: 1).setStroke()
          arrowPath.stroke()

          image.unlockFocus()

          guard
              let tiff = image.tiffRepresentation,
              let bitmap = NSBitmapImageRep(data: tiff),
              let png = bitmap.representation(using: .png, properties: [:])
          else {
              fputs("Unable to render DMG background image.\n", stderr)
              exit(1)
          }

          try png.write(to: URL(fileURLWithPath: outputPath))
          SWIFT

          # Temporary release pipeline: use ad-hoc signing until Developer ID
          # signing and notarization secrets are configured in GitHub Actions.
          /usr/bin/codesign --force --deep --sign - "$RELEASE_APP"

      - name: Validate release bundle metadata
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_APP="$BUILD_ROOT/dmg-root/Bourbon.app"
          BUILD_INFO_PATH="$RELEASE_APP/Contents/Resources/BuildInfo.json"

          if [ ! -f "$BUILD_INFO_PATH" ]; then
            echo "BuildInfo.json is missing from $BUILD_INFO_PATH"
            exit 1
          fi

          echo "Release bundle version:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RELEASE_APP/Contents/Info.plist"
          echo "Release bundle build:"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RELEASE_APP/Contents/Info.plist"
          echo "Release bundle feed URL:"
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$RELEASE_APP/Contents/Info.plist"
          echo "BuildInfo.json:"
          cat "$BUILD_INFO_PATH"

          BUNDLE_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RELEASE_APP/Contents/Info.plist")"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$RELEASE_APP/Contents/Info.plist")"

          if [ "$BUNDLE_IDENTIFIER" != "com.unblockerfire.Bourbon" ]; then
            echo "::error::Unexpected Bourbon bundle identifier: $BUNDLE_IDENTIFIER"
            exit 1
          fi

          if [ "$DISPLAY_NAME" != "Bourbon" ]; then
            echo "::error::Unexpected Bourbon display name: $DISPLAY_NAME"
            exit 1
          fi

          echo "Bourbon bundle metadata is valid."

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail

          RW_DMG="$BUILD_ROOT/Bourbon-rw.dmg"
          MOUNT_DIR="$BUILD_ROOT/dmg-mount"
          FINAL_DMG="${{ steps.paths.outputs.dmg }}"

          rm -f "$RW_DMG" "$FINAL_DMG"
          rm -rf "$MOUNT_DIR"
          mkdir -p "$MOUNT_DIR"

          hdiutil create \
            -volname "Bourbon" \
            -srcfolder "$BUILD_ROOT/dmg-root" \
            -ov \
            -format UDRW \
            "$RW_DMG"

          hdiutil attach "$RW_DMG" \
            -mountpoint "$MOUNT_DIR" \
            -nobrowse \
            -noverify \
            -noautoopen

          cleanup_dmg_mount() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
          }
          trap cleanup_dmg_mount EXIT

          osascript <<APPLESCRIPT
          tell application "Finder"
            set dmgFolder to POSIX file "$MOUNT_DIR" as alias
            open dmgFolder
            delay 1
            set current view of container window of dmgFolder to icon view
            set toolbar visible of container window of dmgFolder to false
            set statusbar visible of container window of dmgFolder to false
            set bounds of container window of dmgFolder to {100, 100, 740, 460}
            set theViewOptions to the icon view options of container window of dmgFolder
            tell theViewOptions
              set arrangement to not arranged
              set icon size to 112
              set background picture to POSIX file "$MOUNT_DIR/.background/BourbonDMGBackground.png"
            end tell
            set position of item "Bourbon.app" of dmgFolder to {176, 184}
            set position of item "Applications" of dmgFolder to {464, 184}
            close container window of dmgFolder
          end tell
          APPLESCRIPT

          sync
          hdiutil detach "$MOUNT_DIR"
          trap - EXIT

          hdiutil convert "$RW_DMG" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            -o "$FINAL_DMG"

          shasum -a 256 "$FINAL_DMG" > "${{ steps.paths.outputs.sha256 }}"

      - name: Generate Sparkle appcast
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          APPCAST_PATH="$BUILD_ROOT/appcast.xml"
          DMG_PATH="${{ steps.paths.outputs.dmg }}"
          DMG_NAME="${{ steps.version.outputs.dmg_name }}"
          RELEASE_APP="$BUILD_ROOT/dmg-root/Bourbon.app"
          DMG_LENGTH="$(stat -f%z "$DMG_PATH")"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          APP_BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RELEASE_APP/Contents/Info.plist")"
          APP_SHORT_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RELEASE_APP/Contents/Info.plist")"
          RELEASE_KIND="${{ steps.version.outputs.release_kind }}"
          RELEASE_CHANNEL="${{ steps.version.outputs.channel }}"
          MINIMUM_AUTOUPDATE_VERSION="${{ steps.version.outputs.minimum_autoupdate_version }}"

          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is required. Refusing to publish an unsigned Sparkle update."
            exit 1
          fi

          SIGN_UPDATE=""
          for candidate in \
            "$PACKAGE_CACHE/artifacts/sparkle/Sparkle/bin/sign_update" \
            "$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update" \
            "/Applications/Sparkle/bin/sign_update" \
            "/usr/local/bin/sign_update" \
            "/opt/homebrew/bin/sign_update"; do
            if [ -x "$candidate" ]; then
              SIGN_UPDATE="$candidate"
              break
            fi
          done

          if [ -z "$SIGN_UPDATE" ]; then
            SIGN_UPDATE="$(find "$PACKAGE_CACHE" "$DERIVED_DATA" -type f -name sign_update -perm -111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SIGN_UPDATE" ]; then
            echo "::error::Sparkle sign_update was not found in SwiftPM artifacts. Refusing to publish an unsigned update."
            exit 1
          fi

          echo "Using Sparkle signing tool: $SIGN_UPDATE"

          # Store private keys only in GitHub Actions Secrets. This temporary
          # file is removed before release upload, and the secret value is never
          # printed to logs.
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle_ed_private_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_FILE"
          chmod 600 "$SPARKLE_KEY_FILE"

          EXPECTED_PUBLIC_ED_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$RELEASE_APP/Contents/Info.plist")"
          swift - "$SPARKLE_KEY_FILE" "$EXPECTED_PUBLIC_ED_KEY" <<'SWIFT'
          import CryptoKit
          import Foundation

          let keyPath = CommandLine.arguments[1]
          let expectedPublicKey = CommandLine.arguments[2]
          let secretString = try String(contentsOfFile: keyPath, encoding: .utf8)
              .trimmingCharacters(in: .whitespacesAndNewlines)

          guard let secret = Data(base64Encoded: secretString) else {
              fputs("SPARKLE_PRIVATE_KEY is not valid base64.\n", stderr)
              exit(1)
          }

          let publicKey: Data
          if secret.count == 32 {
              let privateKey = try Curve25519.Signing.PrivateKey(rawRepresentation: secret)
              publicKey = privateKey.publicKey.rawRepresentation
          } else if secret.count == 96 {
              publicKey = secret.suffix(32)
          } else {
              fputs("SPARKLE_PRIVATE_KEY has an unsupported decoded length.\n", stderr)
              exit(1)
          }

          guard publicKey.base64EncodedString() == expectedPublicKey else {
              fputs("Sparkle private key does not match SUPublicEDKey in Bourbon.app.\n", stderr)
              exit(1)
          }

          print("Sparkle public key matches Bourbon.app SUPublicEDKey.")
          SWIFT

          ED_SIGNATURE="$("$SIGN_UPDATE" --ed-key-file "$SPARKLE_KEY_FILE" -p "$DMG_PATH" | tr -d '\n')"

          if [ -z "$ED_SIGNATURE" ]; then
            echo "::error::Sparkle sign_update did not produce an EdDSA signature."
            rm -f "$SPARKLE_KEY_FILE"
            exit 1
          fi

          "$SIGN_UPDATE" --ed-key-file "$SPARKLE_KEY_FILE" --verify "$DMG_PATH" "$ED_SIGNATURE"

          cat > "$APPCAST_PATH" <<XML
          <?xml version="1.0" standalone="yes"?>
          <rss version="2.0"
            xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle"
            xmlns:bourbon="https://getbourbon.app/appcast">
            <channel>
              <title>Bourbon Updates</title>
              <link>https://github.com/Unblockerfire/Bourbon/releases</link>
              <description>Bourbon release feed.</description>
              <item>
                <title>Bourbon $APP_SHORT_VERSION</title>
                <pubDate>$PUB_DATE</pubDate>
                <description><![CDATA[Release notes are available on the GitHub release for ${{ steps.version.outputs.tag }}.]]></description>
                <sparkle:version>$APP_BUILD_VERSION</sparkle:version>
                <sparkle:shortVersionString>$APP_SHORT_VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:minimumAutoupdateVersion>$MINIMUM_AUTOUPDATE_VERSION</sparkle:minimumAutoupdateVersion>
                <enclosure
                  url="https://github.com/Unblockerfire/Bourbon/releases/download/${{ steps.version.outputs.tag }}/$DMG_NAME"
                  sparkle:edSignature="$ED_SIGNATURE"
                  length="$DMG_LENGTH"
                  type="application/x-apple-diskimage" />
              </item>
            </channel>
          </rss>
          XML

          python3 - "$APPCAST_PATH" "$RELEASE_KIND" "$RELEASE_CHANNEL" "$MINIMUM_AUTOUPDATE_VERSION" "$APP_BUILD_VERSION" "$APP_SHORT_VERSION" "${{ steps.version.outputs.tag }}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          (
              path,
              release_kind,
              release_channel,
              minimum_autoupdate_version,
              app_build_version,
              app_short_version,
              release_tag,
          ) = sys.argv[1:]
          sparkle_namespace = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          bourbon_namespace = "https://getbourbon.app/appcast"
          ET.register_namespace("sparkle", sparkle_namespace)
          ET.register_namespace("bourbon", bourbon_namespace)

          tree = ET.parse(path)
          root = tree.getroot()
          sparkle = f"{{{sparkle_namespace}}}"
          bourbon = f"{{{bourbon_namespace}}}"

          def ensure_text(parent, tag, text):
              child = parent.find(tag)
              if child is None:
                  child = ET.SubElement(parent, tag)
              child.text = text
              return child

          for item in root.findall("./channel/item"):
              ensure_text(item, f"{sparkle}version", app_build_version)
              ensure_text(item, f"{sparkle}shortVersionString", app_short_version)
              ensure_text(item, f"{sparkle}minimumAutoupdateVersion", minimum_autoupdate_version)
              ensure_text(item, f"{bourbon}releaseType", release_kind)
              ensure_text(item, "description", f"Release notes are available on the GitHub release for {release_tag}.")

              if release_channel:
                  ensure_text(item, f"{sparkle}channel", release_channel)

              if release_kind == "emergency" and item.find(f"{sparkle}criticalUpdate") is None:
                  ET.SubElement(item, f"{sparkle}criticalUpdate")

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

          APPCAST_SIGNATURE="$(python3 - "$APPCAST_PATH" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          sparkle_namespace = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          tree = ET.parse(path)
          enclosure = tree.find("./channel/item/enclosure")

          if enclosure is None:
              print("Appcast enclosure is missing.", file=sys.stderr)
              sys.exit(1)

          signature = enclosure.attrib.get(f"{{{sparkle_namespace}}}edSignature")
          if not signature:
              print("Appcast enclosure is missing sparkle:edSignature.", file=sys.stderr)
              sys.exit(1)

          print(signature)
          PY
          )"

          "$SIGN_UPDATE" --ed-key-file "$SPARKLE_KEY_FILE" --verify "$DMG_PATH" "$APPCAST_SIGNATURE"

          if ! grep -q 'sparkle:edSignature=' "$APPCAST_PATH"; then
            echo "::error::Generated appcast is missing sparkle:edSignature."
            rm -f "$SPARKLE_KEY_FILE"
            exit 1
          fi

          rm -f "$SPARKLE_KEY_FILE"
          cat "$APPCAST_PATH"

      - name: Upload validation artifacts
        if: github.ref_type == 'branch' || inputs.validation_only == true
        uses: actions/upload-artifact@v4
        with:
          name: Bourbon-macOS-validation-${{ github.run_number }}
          path: |
            ${{ steps.paths.outputs.dmg }}
            ${{ steps.paths.outputs.sha256 }}
            ${{ steps.paths.outputs.appcast }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && inputs.validation_only != true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.channel != '' }}
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            ${{ steps.paths.outputs.dmg }}
            ${{ steps.paths.outputs.sha256 }}
            ${{ steps.paths.outputs.appcast }}

      - name: Update Homebrew tap
        if: github.ref_type == 'tag' && inputs.validation_only != true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          DMG_PATH: ${{ steps.paths.outputs.dmg }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured."
            exit 1
          fi

          DMG_SHA256="$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')"
          TAP_DIR="$RUNNER_TEMP/homebrew-bourbon"

          git clone \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Unblockerfire/homebrew-bourbon.git" \
            "$TAP_DIR"

          cd "$TAP_DIR"

          python3 - "$RELEASE_VERSION" "$DMG_SHA256" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, sha256 = sys.argv[1:]
          cask_path = Path("Casks/bourbon.rb")
          text = cask_path.read_text(encoding="utf-8")

          text, version_count = re.subn(
              r'  version "[^"]+"',
              f'  version "{version}"',
              text,
              count=1,
          )

          text, sha_count = re.subn(
              r'  sha256 (?::no_check|"[^"]+")',
              f'  sha256 "{sha256}"',
              text,
              count=1,
          )

          if version_count != 1 or sha_count != 1:
              raise SystemExit("Could not safely update version and SHA-256 in bourbon.rb")

          cask_path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Homebrew cask is already current."
            exit 0
          fi

          git add Casks/bourbon.rb
          git commit -m "Update Bourbon cask to ${RELEASE_VERSION}"
          git push origin main

      - name: Announce release in Discord
        if: github.ref_type == 'tag' && inputs.validation_only != true && success()
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_RELEASE_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_RELEASE_WEBHOOK_URL is not configured."
            exit 1
          fi

          node --input-type=module <<'NODE'
          const webhookURL = process.env.DISCORD_RELEASE_WEBHOOK_URL;
          const version = process.env.RELEASE_VERSION;
          const tag = process.env.RELEASE_TAG;
          const releaseURL = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/tag/${encodeURIComponent(tag)}`;
          const versionPattern = /^\d+\.\d+\.\d+(?:[-+][A-Za-z0-9.-]+)?$/;

          if (!versionPattern.test(version)) {
            throw new Error("Release version is not a valid semantic version.");
          }

          const payload = {
            embeds: [{
              title: `🥃 Bourbon Release ${version}`,
              description: `Bourbon ${version} is now available.`,
              color: 0x8B5E34,
              fields: [
                {
                  name: "Homebrew upgrade",
                  value: "```sh\\nbrew update && brew upgrade --cask bourbon\\n```"
                },
                {
                  name: "New install",
                  value: "```sh\\nbrew tap Unblockerfire/bourbon\\nbrew install --cask bourbon\\n```"
                },
                {
                  name: "Release",
                  value: `[View Release](${releaseURL})`
                }
              ],
              footer: {
                text: "Automated Bourbon release announcement"
              }
            }],
            allowed_mentions: { parse: [] }
          };

          const response = await fetch(webhookURL, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            throw new Error(`Discord webhook returned HTTP ${response.status}`);
          }

          console.log("Discord release announcement sent.");
          NODE
