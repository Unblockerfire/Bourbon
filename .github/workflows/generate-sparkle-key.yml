name: Generate Sparkle Recovery Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate encrypted Sparkle key backup
    runs-on: macos-15
    env:
      PROJECT_PATH: Source/Whisky.xcodeproj
      SCHEME: Bourbon
      RECOVERY_AGE_RECIPIENT: ${{ secrets.SPARKLE_KEY_RECOVERY_AGE_RECIPIENT }}

    steps:
      - name: Check out Bourbon
        uses: actions/checkout@v4

      - name: Require offline recovery recipient
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RECOVERY_AGE_RECIPIENT:-}" ]; then
            echo "::error::SPARKLE_KEY_RECOVERY_AGE_RECIPIENT is required before generating a key."
            echo "Create an offline age keypair, then add only its age1... public recipient as this GitHub Actions secret."
            exit 1
          fi

      - name: Resolve Bourbon Swift packages
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/BourbonSparkleKeyDerivedData"
          PACKAGE_CACHE="$RUNNER_TEMP/BourbonSparkleKeySourcePackages"

          echo "DERIVED_DATA=$DERIVED_DATA" >> "$GITHUB_ENV"
          echo "PACKAGE_CACHE=$PACKAGE_CACHE" >> "$GITHUB_ENV"

          xcodebuild \
            -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$PACKAGE_CACHE" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Install encrypted-backup tool
        shell: bash
        run: |
          set -euo pipefail
          brew install age

      - name: Validate offline recovery recipient
        shell: bash
        run: |
          set -euo pipefail

          # Parse and exercise the recipient before any Sparkle key material
          # exists, so a malformed recipient cannot cause an unrecoverable key.
          age -r "$RECOVERY_AGE_RECIPIENT" \
            -o "$RUNNER_TEMP/age-recipient-validation.age" \
            /dev/null
          rm -f "$RUNNER_TEMP/age-recipient-validation.age"

      - name: Generate and encrypt new Sparkle key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          GENERATE_KEYS=""
          for candidate in \
            "$PACKAGE_CACHE/artifacts/sparkle/Sparkle/bin/generate_keys" \
            "$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_keys"; do
            if [ -x "$candidate" ]; then
              GENERATE_KEYS="$candidate"
              break
            fi
          done

          if [ -z "$GENERATE_KEYS" ]; then
            GENERATE_KEYS="$(find "$PACKAGE_CACHE" "$DERIVED_DATA" -type f -name generate_keys -perm -111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$GENERATE_KEYS" ]; then
            echo "::error::Sparkle generate_keys was not found in Bourbon's resolved SwiftPM artifacts."
            exit 1
          fi

          KEY_ACCOUNT="bourbon-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PRIVATE_KEY_FILE="$RUNNER_TEMP/bourbon-sparkle-private-key"
          ENCRYPTED_KEY_FILE="$RUNNER_TEMP/bourbon-sparkle-private-key.age"

          cleanup() {
            rm -f "$PRIVATE_KEY_FILE"
            security delete-generic-password \
              -s "https://sparkle-project.org" \
              -a "$KEY_ACCOUNT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Default mode creates a new key in this fresh runner's Keychain.
          # Its output is suppressed; -p below emits the public key only.
          "$GENERATE_KEYS" --account "$KEY_ACCOUNT" >/dev/null
          PUBLIC_KEY="$("$GENERATE_KEYS" --account "$KEY_ACCOUNT" -p)"

          if ! printf '%s' "$PUBLIC_KEY" | grep -Eq '^[A-Za-z0-9+/]{43}=$'; then
            echo "::error::Sparkle generate_keys did not return the expected public Ed25519 key format."
            exit 1
          fi

          # Sparkle's supported export mode writes the private seed to a file.
          # Never echo, cat, or upload this plaintext file.
          "$GENERATE_KEYS" --account "$KEY_ACCOUNT" -x "$PRIVATE_KEY_FILE"

          # Verify the exported seed derives the public key that Sparkle printed.
          swift - "$PRIVATE_KEY_FILE" "$PUBLIC_KEY" <<'SWIFT'
          import CryptoKit
          import Foundation

          let privatePath = CommandLine.arguments[1]
          let expectedPublicKey = CommandLine.arguments[2]
          let encoded = try String(contentsOfFile: privatePath, encoding: .utf8)
              .trimmingCharacters(in: .whitespacesAndNewlines)

          guard let seed = Data(base64Encoded: encoded), seed.count == 32 else {
              fputs("Exported Sparkle private key has an unexpected format.\n", stderr)
              exit(1)
          }

          let derivedPublicKey = try Curve25519.Signing.PrivateKey(rawRepresentation: seed)
              .publicKey.rawRepresentation.base64EncodedString()
          guard derivedPublicKey == expectedPublicKey else {
              fputs("Exported Sparkle private key does not match the generated public key.\n", stderr)
              exit(1)
          }
          SWIFT

          age -r "$RECOVERY_AGE_RECIPIENT" -o "$ENCRYPTED_KEY_FILE" "$PRIVATE_KEY_FILE"

          # The encrypted file is the only key material retained beyond this step.
          echo "encrypted_key_file=$ENCRYPTED_KEY_FILE" >> "$GITHUB_OUTPUT"

          echo "NEW Sparkle public key: $PUBLIC_KEY"
          echo "Save this value. It will eventually replace SUPublicEDKey in Bourbon's Info.plist."

      - name: Upload encrypted private-key backup
        uses: actions/upload-artifact@v4
        with:
          name: bourbon-sparkle-private-key-encrypted
          path: ${{ steps.key.outputs.encrypted_key_file }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove encrypted runner copy
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/bourbon-sparkle-private-key.age"
