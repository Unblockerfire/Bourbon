name: macOS Validation

on:
  push:
    branches:
      - Bourbon
      - codex/**
  pull_request:
    branches:
      - Bourbon
  workflow_dispatch:

jobs:
  prepare-compatible-runtime:
    name: Prepare macOS 14 compatible BourbonWine
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show minimum-OS environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Prepare corrected runtime
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$RUNNER_TEMP/bourbon-corrected-runtime"
          WORK_DIR="$RUNNER_TEMP/bourbon-runtime-work"
          mkdir -p "$OUTPUT_DIR"
          export BOURBON_MINIMUM_MACOS="$(bash Scripts/bourbon-minimum-macos.sh)"
          bash Scripts/prepare-diagnostic-runtime.sh \
            "$OUTPUT_DIR/BourbonWineDiagnosticRuntime.tar.gz" \
            "$WORK_DIR"

          tar -xOf "$OUTPUT_DIR/BourbonWineDiagnosticRuntime.tar.gz" \
            Libraries/BourbonWineRuntime.json \
            > "$OUTPUT_DIR/BourbonWineDiagnosticRuntime.json"

      - name: Audit current production runtime
        shell: bash
        run: |
          set -euo pipefail

          REPORT_DIR="$RUNNER_TEMP/bourbon-runtime-reports"
          CURRENT_WINE="$RUNNER_TEMP/bourbon-runtime-work/production/Libraries/Wine"
          SUPPORTED_MACOS="$(bash Scripts/bourbon-minimum-macos.sh)"
          mkdir -p "$REPORT_DIR"

          set +e
          python3 Scripts/validate-wine-runtime.py "$CURRENT_WINE" \
            --maximum-minimum "$SUPPORTED_MACOS" \
            --report "$REPORT_DIR/current-runtime-mach-o.tsv" \
            --links-report "$REPORT_DIR/current-runtime-links.txt" \
            2>&1 | tee "$REPORT_DIR/current-runtime-failure.txt"
          STATUS=${PIPESTATUS[0]}
          set -e

          printf '%s\n' "$STATUS" > "$REPORT_DIR/current-runtime-validation-status.txt"
          if [ "$STATUS" -eq 0 ]; then
            echo 'Current production runtime passed the static compatibility gate.'
          else
            echo '::warning::Current production runtime failed the static compatibility gate; see the uploaded verification artifact.'
          fi

          for RELATIVE in \
            bin/wine \
            bin/wineserver \
            lib/wine/x86_64-unix/ntdll.so; do
            SAFE_NAME="$(printf '%s' "$RELATIVE" | tr '/.' '__')"
            BINARY="$CURRENT_WINE/$RELATIVE"
            file "$BINARY" > "$REPORT_DIR/current-$SAFE_NAME-file.txt"
            vtool -show-build "$BINARY" > "$REPORT_DIR/current-$SAFE_NAME-vtool.txt" 2>&1 || true
            otool -l "$BINARY" > "$REPORT_DIR/current-$SAFE_NAME-otool-load-commands.txt"
            otool -L "$BINARY" > "$REPORT_DIR/current-$SAFE_NAME-otool-links.txt"
            nm -u "$BINARY" > "$REPORT_DIR/current-$SAFE_NAME-undefined-symbols.txt" 2>&1 || true
          done

      - name: Validate corrected runtime Mach-O contract
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$RUNNER_TEMP/bourbon-corrected-runtime"
          REPORT_DIR="$RUNNER_TEMP/bourbon-runtime-reports"
          EXTRACT_DIR="$RUNNER_TEMP/bourbon-corrected-runtime-extract"
          SUPPORTED_MACOS="$(bash Scripts/bourbon-minimum-macos.sh)"
          mkdir -p "$EXTRACT_DIR" "$REPORT_DIR"
          tar -xzf "$OUTPUT_DIR/BourbonWineDiagnosticRuntime.tar.gz" -C "$EXTRACT_DIR"

          python3 Scripts/validate-wine-runtime.py "$EXTRACT_DIR/Libraries/Wine" \
            --maximum-minimum "$SUPPORTED_MACOS" \
            --report "$REPORT_DIR/corrected-runtime-mach-o.tsv" \
            --links-report "$REPORT_DIR/corrected-runtime-links.txt"

          file \
            "$EXTRACT_DIR/Libraries/Wine/bin/wine" \
            "$EXTRACT_DIR/Libraries/Wine/bin/wineserver" \
            "$EXTRACT_DIR/Libraries/Wine/lib/wine/x86_64-unix/ntdll.so" \
            "$EXTRACT_DIR/Libraries/Wine/lib/libvulkan.1.dylib" \
            | tee "$REPORT_DIR/corrected-runtime-file.txt"
          vtool -show-build "$EXTRACT_DIR/Libraries/Wine/bin/wine" \
            | tee "$REPORT_DIR/corrected-wine-vtool.txt"
          vtool -show-build "$EXTRACT_DIR/Libraries/Wine/bin/wineserver" \
            | tee "$REPORT_DIR/corrected-wineserver-vtool.txt"
          vtool -show-build "$EXTRACT_DIR/Libraries/Wine/lib/wine/x86_64-unix/ntdll.so" \
            | tee "$REPORT_DIR/corrected-ntdll-vtool.txt"
          vtool -show-build "$EXTRACT_DIR/Libraries/Wine/lib/libvulkan.1.dylib" \
            | tee "$REPORT_DIR/corrected-vulkan-loader-vtool.txt"

      - name: Execute corrected Wine on macOS 14
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/bourbon-corrected-runtime-extract/Libraries/Wine"
          export PATH="$ROOT/bin:$PATH"
          export DYLD_LIBRARY_PATH="$ROOT/lib"
          export DYLD_FALLBACK_LIBRARY_PATH="$ROOT/lib"

          "$ROOT/bin/wine" --version \
            | tee "$RUNNER_TEMP/bourbon-runtime-reports/corrected-wine-version.txt"
          "$ROOT/bin/wineserver" --version \
            | tee "$RUNNER_TEMP/bourbon-runtime-reports/corrected-wineserver-version.txt"

      - name: Upload corrected runtime
        uses: actions/upload-artifact@v4
        with:
          name: bourbon-corrected-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bourbon-corrected-runtime
          if-no-files-found: error
          retention-days: 14

      - name: Upload runtime verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourbon-runtime-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bourbon-runtime-reports
          if-no-files-found: warn
          retention-days: 14

  inspect-production-release:
    name: Inspect production release DMG
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download and inspect latest production DMG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$RUNNER_TEMP/production-release"
          MOUNT_DIR="$RUNNER_TEMP/production-release-mount"
          mkdir -p "$RELEASE_DIR" "$MOUNT_DIR"

          RELEASE_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.dmg' \
            --dir "$RELEASE_DIR"

          DMG_PATH="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$DMG_PATH" ]; then
            echo "::error::Latest release did not contain a DMG."
            exit 1
          fi

          hdiutil attach "$DMG_PATH" \
            -mountpoint "$MOUNT_DIR" \
            -nobrowse \
            -readonly \
            -noverify

          cleanup_mount() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
          }
          trap cleanup_mount EXIT

          APP_PATH="$MOUNT_DIR/Bourbon.app"
          BUILD_INFO_PATH="$APP_PATH/Contents/Resources/BuildInfo.json"
          if [ ! -f "$BUILD_INFO_PATH" ]; then
            echo "::error::Production Bourbon.app is missing BuildInfo.json."
            exit 1
          fi

          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$APP_PATH/Contents/Info.plist")"
          BUNDLE_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$APP_PATH/Contents/Info.plist")"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          EXPECTED_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"

          python3 - "$BUILD_INFO_PATH" "$EXPECTED_COMMIT" "$EXPECTED_VERSION" "$BUNDLE_BUILD" <<'PY'
          import json
          import sys

          path, expected_commit, expected_version, expected_build = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              build_info = json.load(source)

          checks = {
              "gitCommit": expected_commit,
              "marketingVersion": expected_version,
              "buildNumber": expected_build,
          }
          for key, expected in checks.items():
              actual = str(build_info.get(key, ""))
              if actual != expected:
                  raise SystemExit(
                      f"Production BuildInfo {key} mismatch: expected {expected}, got {actual}"
                  )

          print(json.dumps(build_info, indent=2, sort_keys=True))
          PY

          if [ "$BUNDLE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Production bundle version does not match release tag."
            exit 1
          fi

          echo "Production tag: $RELEASE_TAG"
          echo "Production commit: $EXPECTED_COMMIT"
          echo "Production bundle version: $BUNDLE_VERSION"
          echo "Production bundle build: $BUNDLE_BUILD"

  validate-macos:
    name: Validate Bourbon on macOS
    needs: prepare-compatible-runtime
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Download corrected diagnostic runtime
        uses: actions/download-artifact@v5
        with:
          name: bourbon-corrected-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bourbon-corrected-runtime

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Resolve Swift packages
        working-directory: Source
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Whisky.xcodeproj \
            -scheme Bourbon

      - name: Run SwiftLint
        working-directory: Source
        run: swiftlint lint --strict

      - name: Validate diagnostic installer appearance contract
        shell: bash
        run: |
          set -euo pipefail

          INSTALLER_VIEW='Source/Whisky/Views/DiagnosticAppInstallerView.swift'
          DRAG_VIEW='Source/Whisky/Views/DiagnosticAppInstallerDragView.swift'
          grep -F 'Color(nsColor: .windowBackgroundColor)' "$INSTALLER_VIEW"
          grep -F 'Color(nsColor: .controlBackgroundColor)' "$INSTALLER_VIEW" "$DRAG_VIEW"
          ! grep -En 'Color\.black|\.foregroundStyle\(\.(black|white)\)|\.foregroundColor\(\.(black|white)\)' \
            "$INSTALLER_VIEW" "$DRAG_VIEW"

      - name: Validate diagnostic license lifecycle contract
        shell: bash
        run: |
          set -euo pipefail

          INTRO='Source/Whisky/Views/Setup/BourbonIntroVideoView.swift'
          LICENSE='Source/Whisky/Views/Setup/WelcomeView.swift'
          POLICY='Source/WhiskyKit/Sources/WhiskyKit/Licensing/BourbonLicenseStoragePolicy.swift'
          FAILURE_POLICY='Source/WhiskyKit/Sources/WhiskyKit/Licensing/BourbonLicenseServiceFailure.swift'

          for event in \
            license.ui.opened \
            license.validation.started \
            license.validation.completed \
            license.validation.failed \
            license.overlay.presented \
            license.overlay.dismissed \
            license.validation.request.started \
            license.validation.request.failed \
            license.validation.response.received \
            license.validation.decoding.started \
            license.validation.decoding.completed \
            license.validation.decoding.failed \
            license.ui.surface.audit \
            license.ui.window_hierarchy.started \
            license.ui.window_hierarchy.completed \
            license.ui.window \
            license.ui.view \
            license.ui.responsive; do
            grep -Fq "$event" "$INTRO" "$LICENSE"
          done

          grep -Fq 'if licenseGate.mountsIntroSurface' "$INTRO"
          grep -Fq 'BourbonSurfaceOwnershipMarker(role: "intro_surface")' "$INTRO"
          grep -Fq 'BourbonSurfaceOwnershipMarker(role: "license_overlay")' "$INTRO"
          grep -Fq 'override func hitTest(_ point: NSPoint) -> NSView?' "$INTRO"
          grep -Fq 'let windows = NSApp.windows.filter(\.isVisible)' "$INTRO"
          grep -Fq 'CGWindowListCopyWindowInfo' "$INTRO"
          grep -Fq 'workspace.isVoiceOverEnabled' "$INTRO"
          grep -Fq 'Copy UI Report' "$INTRO"
          grep -Fq 'BourbonBuildDiagnostics.current.gitCommitShort' "$INTRO"
          grep -Fq 'showButton = true' "$INTRO"
          grep -Fq 'let playerLayer = AVPlayerLayer()' "$INTRO"
          grep -Fq 'private final class BourbonPlayerSurfaceNSView' "$INTRO"
          grep -Fq 'license.player.surface.created", detail: "kind=avplayerlayer' "$INTRO"
          ! grep -Fq 'AVPlayerView' "$INTRO"
          ! grep -Fq 'import AVKit' "$INTRO"
          grep -Fq 'license.player.created", detail: "stage=validation_succeeded' "$INTRO"
          ! grep -A8 -F '.onAppear {' "$INTRO" | grep -Fq 'AVPlayer(url:'
          ! sed -n '1,220p' "$INTRO" | grep -Fq 'ProgressView()'
          grep -Fq 'Copy Diagnostic UI Report' 'Source/Whisky/Views/WhiskyApp.swift'
          grep -Fq 'keyboardShortcut("D", modifiers: [.command, .shift])' \
            'Source/Whisky/Views/WhiskyApp.swift'
          grep -Fq 'configuration.timeoutIntervalForRequest = 30' "$LICENSE"
          grep -Fq 'configuration.timeoutIntervalForResource = 45' "$LICENSE"
          grep -Fq 'transport_timeout' "$FAILURE_POLICY"
          grep -Fq 'kSecUseAuthenticationUIFail' "$LICENSE"
          grep -Fq 'diagnosticTokenAccount = "license-token-diagnostic"' "$POLICY"
          grep -Fq 'return [diagnosticBundleIdentifier, productionBundleIdentifier]' "$POLICY"
          grep -Fq '!isDiagnostic(bundleIdentifier: bundleIdentifier)' "$POLICY"

      - name: Validate login item and session restoration contract
        shell: bash
        run: |
          set -euo pipefail

          APP_DELEGATE='Source/Whisky/AppDelegate.swift'
          SETTINGS='Source/Whisky/Views/Settings/SettingsView.swift'
          APP='Source/Whisky/Views/WhiskyApp.swift'

          grep -Fq 'app.launch.context' "$APP_DELEGATE"
          grep -Fq 'NSApplicationLaunchIsLoginItemKey' "$APP_DELEGATE"
          grep -Fq 'NSApplicationLaunchIsSessionRestoreKey' "$APP_DELEGATE"
          grep -Fq 'SMAppService.mainApp.status' "$APP_DELEGATE"
          ! grep -Eq 'SMAppService.*\.(register|unregister)\(' "$APP_DELEGATE" "$SETTINGS" "$APP"
          ! grep -Eiq 'open bourbon at login|launch at login' "$SETTINGS"

          INSTALLER='Source/Whisky/Views/DiagnosticAppInstallerView.swift'
          grep -Fq 'app.install.previous_process.detected' "$INSTALLER"
          grep -Fq 'app.install.previous_process.terminate_requested' "$INSTALLER"
          grep -Fq 'app.install.previous_process.force_terminate_requested' "$INSTALLER"

      - name: Probe license service transport and response contract
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/bourbon-validation-logs"
          RESPONSE="$RUNNER_TEMP/bourbon-validation-logs/license-service-probe.json"
          METRICS="$RUNNER_TEMP/bourbon-validation-logs/license-service-probe.txt"
          STATUS="$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 45 \
            --header 'Content-Type: application/json' \
            --data '{"licenseId":"diagnostic-probe","licenseToken":"diagnostic-probe"}' \
            --output "$RESPONSE" \
            --write-out '%{http_code}' \
            https://api.getbourbon.app/license/validate)"

          printf 'host=api.getbourbon.app path=/license/validate status=%s bytes=%s\n' \
            "$STATUS" "$(wc -c < "$RESPONSE")" | tee "$METRICS"
          test "$STATUS" = "400"
          python3 - "$RESPONSE" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          assert payload == {"ok": False, "error": "Invalid license validation request"}
          PY

      - name: Validate BourbonWine update interaction contract
        shell: bash
        run: |
          set -euo pipefail
          CONTENT_VIEW="Source/Whisky/Views/ContentView.swift"
          INSTALL_VIEW="Source/Whisky/Views/Setup/WhiskyWineInstallView.swift"
          RECOVERY_VIEW="Source/Whisky/Views/Setup/WhiskyWineGatekeeperRecoveryView.swift"
          DOWNLOAD_VIEW="Source/Whisky/Views/Setup/WhiskyWineDownloadView.swift"
          INSTALLER="Source/WhiskyKit/Sources/WhiskyKit/WhiskyWine/WhiskyWineInstaller.swift"

          grep -Fq 'BourbonWineRuntimeUpdateView' "$CONTENT_VIEW"
          grep -Fq 'runtime.update.button.clicked' "$CONTENT_VIEW"
          grep -Fq 'installLatestRuntimeUpdate' "$CONTENT_VIEW"
          ! grep -A4 -F 'runtime.update.button.clicked' "$CONTENT_VIEW" | grep -Fq 'WhiskyWineInstaller.uninstall()'
          grep -Fq '@State private var runtimeUpdatePresentation: BourbonWineRuntimeUpdatePresentation?' "$CONTENT_VIEW"
          grep -Fq '.sheet(item: $runtimeUpdatePresentation' "$CONTENT_VIEW"
          ! grep -Fq 'showRuntimeUpdate' "$CONTENT_VIEW"
          ! grep -Fq 'runtimeUpdateVersion' "$CONTENT_VIEW"
          grep -Fq 'if updateInfo.0, !showSetup' "$CONTENT_VIEW"
          grep -Fq 'sheet.not_presented' "$CONTENT_VIEW"
          for event in \
            sheet.present \
            sheet.dismiss \
            sheet.welcome.state; do
            grep -Fq "$event" "$CONTENT_VIEW" 'Source/Whisky/Views/Setup/WelcomeView.swift'
          done
          for event in \
            runtime.retry.started \
            runtime.archive.selected \
            runtime.extract.started \
            runtime.extract.completed \
            runtime.install.started \
            runtime.install.completed \
            runtime.preflight.started \
            runtime.wine_version.started \
            runtime.wine_version.completed \
            runtime.gatekeeper_check \
            runtime.gatekeeper.detected \
            runtime.gatekeeper.settings_opened \
            runtime.retry.files_verified \
            runtime.retry.preflight.started \
            runtime.retry.preflight.succeeded \
            runtime.retry.preflight.blocked \
            runtime.retry.failed \
            runtime.readiness.completed \
            runtime.ui.finalized \
            runtime.discovery.started \
            runtime.discovery.missing \
            runtime.discovery.found \
            runtime.discovery.valid \
            runtime.discovery.incomplete \
            runtime.discovery.gatekeeper_blocked \
            runtime.discovery.ready \
            runtime.discovery.path \
            runtime.discovery.files_present \
            runtime.discovery.permissions \
            runtime.discovery.manifest \
            runtime.discovery.preflight \
            runtime.discovery.classification \
            runtime.download.required \
            runtime.download.reason \
            runtime.download.skipped_existing \
            runtime.download.quarantine \
            runtime.install.quarantine \
            runtime.component.quarantine \
            runtime.download.sha256.succeeded \
            runtime.resolver.started \
            runtime.resolver.succeeded \
            runtime.acquisition.source \
            runtime.manual.download.completed \
            runtime.manual.install.started \
            runtime.manual.install.succeeded \
            runtime.manual.install.failed \
            runtime.backup.created \
            runtime.rollback.started \
            runtime.rollback.succeeded \
            runtime.update.started \
            runtime.update.download.started \
            runtime.update.download.progress \
            runtime.update.download.completed \
            runtime.update.verification.started \
            runtime.update.verification.completed \
            runtime.update.extraction.started \
            runtime.update.extraction.completed \
            runtime.update.install.started \
            runtime.update.install.completed \
            runtime.update.preflight.started \
            runtime.update.preflight.completed \
            runtime.update.failed; do
            grep -Fq "$event" "$CONTENT_VIEW" "$INSTALL_VIEW" "$RECOVERY_VIEW" "$DOWNLOAD_VIEW" "$INSTALLER"
          done

          grep -Fq 'macOS blocked BourbonWine' "$RECOVERY_VIEW"
          grep -Fq 'Open Privacy & Security' "$RECOVERY_VIEW"
          grep -Fq 'retryInstalledRuntimeReadiness' "$RECOVERY_VIEW"
          grep -Fq 'Restore Previous BourbonWine' "$RECOVERY_VIEW"
          grep -Fq 'Install BourbonWine Manually' "$DOWNLOAD_VIEW"
          grep -Fq 'Download BourbonWine Manually' "$DOWNLOAD_VIEW"
          grep -Fq 'downloadLatestRuntimeForManualInstallation' "$DOWNLOAD_VIEW" "$INSTALLER"
          ! grep -Fq 'loadBundledDiagnosticRuntime' "$DOWNLOAD_VIEW"
          ! grep -Fq 'exportBundledDiagnosticRuntimeForManualInstallation' "$DOWNLOAD_VIEW"
          grep -Fq 'runtimeAcquisitionSource' "$INSTALLER"
          grep -Fq 'runWineVersion: false' "$INSTALLER"

          WINE='Source/WhiskyKit/Sources/WhiskyKit/Wine/Wine.swift'
          for event in \
            runtime.bundle.archive.found \
            runtime.bundle.manifest.loaded \
            runtime.install.required \
            runtime.install.destination \
            runtime.extract.started \
            runtime.extract.completed \
            runtime.extract.failed \
            runtime.executable.resolved \
            runtime.executable.exists \
            runtime.executable.permissions \
            runtime.preflight.started \
            runtime.preflight.process.started \
            runtime.preflight.process.terminated \
            runtime.preflight.failed; do
            grep -Fq "$event" "$CONTENT_VIEW" "$INSTALL_VIEW" "$INSTALLER" "$WINE"
          done

      - name: Validate production BourbonWine launcher contract
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME_JSON="$RUNNER_TEMP/bourbon-runtime.json"
          RUNTIME_ARCHIVE="$RUNNER_TEMP/bourbon-runtime.tar.gz"
          RUNTIME_LISTING="$RUNNER_TEMP/bourbon-runtime-files.txt"
          RUNTIME_EXTRACT="$RUNNER_TEMP/bourbon-runtime-extract"
          mkdir -p "$RUNNER_TEMP/bourbon-validation-logs"

          curl --fail --silent --show-error \
            https://api.getbourbon.app/runtime/latest \
            --output "$RUNTIME_JSON"

          RUNTIME_URL="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["archiveUrl"])' \
            "$RUNTIME_JSON")"
          RUNTIME_SHA256="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' \
            "$RUNTIME_JSON")"
          RUNTIME_WINE_VERSION="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["wineVersion"])' \
            "$RUNTIME_JSON")"
          RUNTIME_ARCHIVE_NAME="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["archiveName"])' \
            "$RUNTIME_JSON")"
          RUNTIME_API_VERSION="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["version"])' \
            "$RUNTIME_JSON")"

          test "$RUNTIME_API_VERSION" = '1.0.2'
          test "$RUNTIME_WINE_VERSION" = 'wine-11.16'
          test "$RUNTIME_ARCHIVE_NAME" = 'BourbonWine-1.0.2-macOS-x86_64.tar.gz'
          test "$RUNTIME_SHA256" = '6e070803fb5d1f9f92152b82ec6a1dab4cb82bcc1bc719663dda4a492875fce8'

          curl --fail --location --silent --show-error \
            "$RUNTIME_URL" \
            --output "$RUNTIME_ARCHIVE"
          printf '%s  %s\n' "$RUNTIME_SHA256" "$RUNTIME_ARCHIVE" | shasum -a 256 --check

          tar -tzf "$RUNTIME_ARCHIVE" > "$RUNTIME_LISTING"
          for REQUIRED_PATH in \
            Libraries/Wine/bin/wineserver \
            Libraries/Wine/lib/wine/x86_64-unix/ntdll.so \
            Libraries/Wine/lib/libvulkan.1.dylib \
            Libraries/BourbonWineRuntime.json \
            Libraries/BourbonWineVersion.plist; do
            grep -Fx "$REQUIRED_PATH" "$RUNTIME_LISTING"
          done

          if grep -Fxq 'Libraries/Wine/bin/wine' "$RUNTIME_LISTING"; then
            SELECTED_LAUNCHER='Libraries/Wine/bin/wine'
          elif grep -Fxq 'Libraries/Wine/bin/wine64' "$RUNTIME_LISTING"; then
            SELECTED_LAUNCHER='Libraries/Wine/bin/wine64'
          else
            echo '::error::Production runtime contains neither wine nor wine64.'
            exit 1
          fi

          mkdir -p "$RUNTIME_EXTRACT"
          tar -xzf "$RUNTIME_ARCHIVE" -C "$RUNTIME_EXTRACT"
          test -x "$RUNTIME_EXTRACT/$SELECTED_LAUNCHER"

          RUNTIME_MANIFEST_VERSION="$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["runtimeVersion"])' \
            "$RUNTIME_EXTRACT/Libraries/BourbonWineRuntime.json")"
          RUNTIME_MARKER_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :version' \
            "$RUNTIME_EXTRACT/Libraries/BourbonWineVersion.plist")"
          test "$RUNTIME_MANIFEST_VERSION" = "$RUNTIME_API_VERSION"
          test "$RUNTIME_MARKER_VERSION" = "$RUNTIME_API_VERSION"

          RUNTIME_WINE_ROOT="$RUNTIME_EXTRACT/Libraries/Wine"
          DYLD_LIBRARY_PATH="$RUNTIME_WINE_ROOT/lib" \
            DYLD_FALLBACK_LIBRARY_PATH="$RUNTIME_WINE_ROOT/lib" \
            "$RUNTIME_EXTRACT/$SELECTED_LAUNCHER" --version \
            | tee "$RUNNER_TEMP/bourbon-validation-logs/production-runtime-wine-version.txt"
          DYLD_LIBRARY_PATH="$RUNTIME_WINE_ROOT/lib" \
            DYLD_FALLBACK_LIBRARY_PATH="$RUNTIME_WINE_ROOT/lib" \
            "$RUNTIME_WINE_ROOT/bin/wineserver" --version \
            | tee "$RUNNER_TEMP/bourbon-validation-logs/production-runtime-wineserver-version.txt"

          {
            echo 'CI quarantine limitation: archive fetched by curl on a GitHub runner; no Safari provenance is expected.'
            for COMPONENT in \
              "$RUNTIME_ARCHIVE" \
              "$RUNTIME_EXTRACT/$SELECTED_LAUNCHER" \
              "$RUNTIME_WINE_ROOT/bin/wineserver" \
              "$RUNTIME_WINE_ROOT/lib/libMoltenVK.dylib" \
              "$RUNTIME_WINE_ROOT/lib/libvulkan.1.dylib" \
              "$RUNTIME_WINE_ROOT/lib/wine/x86_64-unix/ntdll.so"; do
              echo "component=$(basename "$COMPONENT")"
              xattr -l "$COMPONENT" 2>&1 || true
            done
          } > "$RUNNER_TEMP/bourbon-validation-logs/production-runtime-xattrs.txt"

          echo "Resolver-selected production runtime launcher: $SELECTED_LAUNCHER"
          echo "Production runtime Wine version: $RUNTIME_WINE_VERSION"

      - name: Run WhiskyKit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bourbon-validation-logs"
          swift test --package-path Source/WhiskyKit 2>&1 \
            | tee "$RUNNER_TEMP/bourbon-validation-logs/whiskykit-tests.log"

      - name: Build Bourbon
        working-directory: Source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/bourbon-validation-logs"
          DERIVED_DATA="$RUNNER_TEMP/BourbonDiagnosticDerivedData"

          xcodebuild \
            -project Whisky.xcodeproj \
            -scheme Bourbon \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 \
            | tee "$RUNNER_TEMP/bourbon-validation-logs/bourbon-release-build.log"

      - name: Write diagnostic build metadata
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/BourbonDiagnosticDerivedData/Build/Products/Release/Bourbon.app"
          BUILD_INFO_PATH="$APP_PATH/Contents/Resources/BuildInfo.json"
          MARKETING_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$APP_PATH/Contents/Info.plist")"
          BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$APP_PATH/Contents/Info.plist")"

          export BUILD_INFO_PATH MARKETING_VERSION BUILD_NUMBER
          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "gitCommit": os.environ["GITHUB_SHA"],
              "marketingVersion": os.environ["MARKETING_VERSION"],
              "buildNumber": os.environ["BUILD_NUMBER"],
              "buildDateUTC": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open(os.environ["BUILD_INFO_PATH"], "w", encoding="utf-8") as destination:
              json.dump(payload, destination, indent=2, sort_keys=True)
              destination.write("\n")
          PY

      - name: Create non-production diagnostic DMG
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/BourbonDiagnosticDerivedData"
          SOURCE_APP="$DERIVED_DATA/Build/Products/Release/Bourbon.app"
          DIAGNOSTIC_ROOT="$RUNNER_TEMP/bourbon-diagnostic-root"
          DIAGNOSTIC_OUTPUT="$RUNNER_TEMP/bourbon-diagnostic-dmg"
          DIAGNOSTIC_APP="$DIAGNOSTIC_ROOT/Bourbon Diagnostic.app"
          DIAGNOSTIC_DMG="$DIAGNOSTIC_OUTPUT/Bourbon-diagnostic-${GITHUB_SHA::12}.dmg"

          test -d "$SOURCE_APP"
          mkdir -p "$DIAGNOSTIC_ROOT" "$DIAGNOSTIC_OUTPUT"
          ditto "$SOURCE_APP" "$DIAGNOSTIC_APP"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Bourbon Diagnostic' \
            "$DIAGNOSTIC_APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.unblockerfire.BourbonDiagnostic' \
            "$DIAGNOSTIC_APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Delete :SUFeedURL' \
            "$DIAGNOSTIC_APP/Contents/Info.plist" 2>/dev/null || true
          /usr/bin/codesign --force --deep --sign - "$DIAGNOSTIC_APP"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' \
            "$DIAGNOSTIC_APP/Contents/Info.plist")"
          BUNDLE_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$DIAGNOSTIC_APP/Contents/Info.plist")"
          test "$DISPLAY_NAME" = 'Bourbon Diagnostic'
          test "$BUNDLE_IDENTIFIER" = 'com.unblockerfire.BourbonDiagnostic'
          test ! -e "$DIAGNOSTIC_ROOT/Bourbon.app"
          test ! -e "$DIAGNOSTIC_APP/Contents/Library/LoginItems"
          ! /usr/libexec/PlistBuddy -c 'Print :SMPrivilegedExecutables' \
            "$DIAGNOSTIC_APP/Contents/Info.plist" >/dev/null 2>&1
          test -f "$DIAGNOSTIC_APP/Contents/Resources/BuildInfo.json"
          test ! -e "$DIAGNOSTIC_APP/Contents/Resources/BourbonWineDiagnosticRuntime.tar.gz"
          test ! -e "$DIAGNOSTIC_APP/Contents/Resources/BourbonWineDiagnosticRuntime.json"
          python3 - "$DIAGNOSTIC_APP/Contents/Resources/BuildInfo.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              build_info = json.load(source)
          if build_info.get("gitCommit") != sys.argv[2]:
              raise SystemExit("Diagnostic BuildInfo commit does not match GITHUB_SHA")
          print(f"Diagnostic commit: {build_info['gitCommit']}")
          PY

          hdiutil create \
            -volname 'Bourbon Diagnostic' \
            -srcfolder "$DIAGNOSTIC_ROOT" \
            -ov \
            -format UDZO \
            "$DIAGNOSTIC_DMG"
          shasum -a 256 "$DIAGNOSTIC_DMG" > "$DIAGNOSTIC_DMG.sha256"

      - name: Validate packaged diagnostic DMG production runtime acquisition
        shell: bash
        run: |
          set -euo pipefail

          DMG_PATH="$(find "$RUNNER_TEMP/bourbon-diagnostic-dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          MOUNT_DIR="$RUNNER_TEMP/bourbon-diagnostic-mounted"
          mkdir -p "$MOUNT_DIR"
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_DIR" -nobrowse -readonly -noverify
          cleanup_mount() { hdiutil detach "$MOUNT_DIR" -quiet || true; }
          trap cleanup_mount EXIT

          APP="$MOUNT_DIR/Bourbon Diagnostic.app"
          test ! -e "$APP/Contents/Resources/BourbonWineDiagnosticRuntime.tar.gz"
          test ! -e "$APP/Contents/Resources/BourbonWineDiagnosticRuntime.json"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = \
            'com.unblockerfire.BourbonDiagnostic'
          test ! -e "$APP/Contents/Library/LoginItems"
          ! /usr/libexec/PlistBuddy -c 'Print :SMPrivilegedExecutables' \
            "$APP/Contents/Info.plist" >/dev/null 2>&1
          printf '%s\n' \
            'bundle_identifier=com.unblockerfire.BourbonDiagnostic' \
            'embedded_login_items=false' \
            'sm_privileged_executables=false' \
            'embedded_bourbonwine_runtime=false' \
            'runtime_acquisition=production_runtime_api' \
            > "$RUNNER_TEMP/bourbon-validation-logs/packaged-dmg-login-item-audit.txt"
          BOURBON_PACKAGED_DIAGNOSTIC_APP="$APP" \
            swift test --package-path Source/WhiskyKit \
              --filter WhiskyWineRuntimeReadinessTests/testPackagedDiagnosticUsesProductionRuntimeAcquisition

          {
            echo 'CI quarantine limitation: this DMG was built and mounted locally, not downloaded by Safari.'
            echo 'dmg:'
            xattr -l "$DMG_PATH" 2>&1 || true
            echo 'app:'
            xattr -l "$APP" 2>&1 || true
          } > "$RUNNER_TEMP/bourbon-validation-logs/packaged-dmg-xattrs.txt"

      - name: Upload diagnostic DMG
        uses: actions/upload-artifact@v4
        with:
          name: bourbon-diagnostic-dmg-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bourbon-diagnostic-dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bourbon-macos-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bourbon-validation-logs
          if-no-files-found: warn
          retention-days: 14
