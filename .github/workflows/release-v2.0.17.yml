name: Release Bourbon 2.0.17

on:
  push:
    branches:
      - release/v2.0.17
    paths:
      - .github/workflows/release-v2.0.17.yml

permissions:
  contents: write

jobs:
  trigger-release:
    name: Tag, publish feeds, and verify distribution
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: 2.0.17
      RELEASE_TAG: v2.0.17
      REPOSITORY: Unblockerfire/Bourbon
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check release prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not configured."
            exit 1
          fi
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured."
            exit 1
          fi
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN is not configured."
            exit 1
          fi

      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create production tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::${RELEASE_TAG} already exists at ${EXISTING_SHA}, expected ${GITHUB_SHA}."
              exit 1
            fi
            echo "${RELEASE_TAG} already points at this release commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${GITHUB_SHA}" -m "Bourbon ${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Wait for GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          APPCAST_URL="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/appcast.xml"
          DMG_URL="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/Bourbon${RELEASE_VERSION}.dmg"
          ready=0
          for attempt in $(seq 1 72); do
            if curl -fsSL "$APPCAST_URL" -o /tmp/appcast.xml && curl -fsSI "$DMG_URL" >/dev/null; then
              ready=1
              break
            fi
            echo "Waiting for release workflow, attempt ${attempt}/72..."
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Timed out waiting for ${RELEASE_TAG} release assets."
            exit 1
          fi

      - name: Build runtime update configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          tree = ET.parse("/tmp/appcast.xml")
          root = tree.getroot()
          sparkle = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          bourbon = "{https://getbourbon.app/appcast}"
          item = root.find("./channel/item")
          if item is None:
              raise SystemExit("Appcast is missing an item")
          enclosure = item.find("enclosure")
          if enclosure is None:
              raise SystemExit("Appcast is missing an enclosure")

          def text(name, required=True):
              node = item.find(name)
              value = (node.text or "").strip() if node is not None else ""
              if required and not value:
                  raise SystemExit(f"Appcast is missing {name}")
              return value or None

          version = text(f"{sparkle}shortVersionString")
          if version != os.environ["RELEASE_VERSION"]:
              raise SystemExit(f"Unexpected appcast version: {version}")

          signature = enclosure.attrib.get(f"{sparkle}edSignature")
          if not signature:
              raise SystemExit("Appcast is missing EdDSA signature")

          pub_date = parsedate_to_datetime(text("pubDate")).isoformat().replace("+00:00", "Z")
          release = {
              "version": version,
              "build": text(f"{sparkle}version"),
              "dmgUrl": enclosure.attrib["url"],
              "dmgLength": int(enclosure.attrib["length"]),
              "pubDate": pub_date,
              "minimumSystemVersion": text(f"{sparkle}minimumSystemVersion"),
              "minimumAutoupdateVersion": text(f"{sparkle}minimumAutoupdateVersion", required=False),
              "releaseType": text(f"{bourbon}releaseType", required=False),
              "edSignature": signature,
          }
          payload = {"stable": release, "pre": release}
          with open("BourbonRuntimeAPI/updates.json", "w", encoding="utf-8") as output:
              json.dump(payload, output, indent=2)
              output.write("\n")
          print(f"Prepared runtime feeds for Bourbon {version}")
          PY

      - name: Install flyctl
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://fly.io/install.sh | sh
          "$HOME/.fly/bin/flyctl" version

      - name: Deploy runtime update feed
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/.fly/bin/flyctl" deploy \
            --config BourbonRuntimeAPI/fly.toml \
            --dockerfile BourbonRuntimeAPI/Dockerfile \
            --remote-only

      - name: Verify Sparkle feeds
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            all_ok=1
            for channel in stable pre; do
              if ! curl -fsSL "https://api.getbourbon.app/updates/${channel}/appcast.xml" -o "/tmp/${channel}.xml"; then
                all_ok=0
                break
              fi
              if ! python3 - "$channel" "/tmp/${channel}.xml" "$RELEASE_VERSION" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          channel, path, expected = sys.argv[1:]
          sparkle = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"
          root = ET.parse(path).getroot()
          item = root.find("./channel/item")
          version = item.find(f"{sparkle}shortVersionString").text.strip() if item is not None else None
          if version != expected:
              raise SystemExit(f"{channel} feed reports {version!r}, expected {expected!r}")
          print(f"Verified {channel} feed at {version}")
          PY
              then
                all_ok=0
                break
              fi
            done
            if [ "$all_ok" -eq 1 ]; then
              ready=1
              break
            fi
            echo "Waiting for deployed Sparkle feeds, attempt ${attempt}/36..."
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Sparkle feeds did not update to ${RELEASE_VERSION}."
            exit 1
          fi

      - name: Persist update metadata to Bourbon branch
        shell: bash
        run: |
          set -euo pipefail
          cp BourbonRuntimeAPI/updates.json /tmp/updates.json
          git fetch origin Bourbon
          git checkout -B persist-release-feed origin/Bourbon
          cp /tmp/updates.json BourbonRuntimeAPI/updates.json
          if git diff --quiet -- BourbonRuntimeAPI/updates.json; then
            echo "BourbonRuntimeAPI/updates.json already matches ${RELEASE_VERSION}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BourbonRuntimeAPI/updates.json
          git commit -m "Update Bourbon runtime feed to ${RELEASE_VERSION}"
          git push origin HEAD:Bourbon

      - name: Verify Homebrew cask
        shell: bash
        run: |
          set -euo pipefail
          CASK_URL="https://raw.githubusercontent.com/Unblockerfire/homebrew-bourbon/main/Casks/bourbon.rb"
          ready=0
          for attempt in $(seq 1 36); do
            if curl -fsSL "$CASK_URL" -o /tmp/bourbon.rb && grep -Fq "version \"${RELEASE_VERSION}\"" /tmp/bourbon.rb; then
              ready=1
              break
            fi
            echo "Waiting for Homebrew tap, attempt ${attempt}/36..."
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Homebrew tap did not update to ${RELEASE_VERSION}."
            exit 1
          fi
          grep -F "version \"${RELEASE_VERSION}\"" /tmp/bourbon.rb
          echo "Homebrew cask verified at ${RELEASE_VERSION}."
